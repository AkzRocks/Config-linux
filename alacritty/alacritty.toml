# =========================
# 🪟 WINDOW
# =========================
[window]
opacity = 0.85
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "Full"

# =========================
# 🔤 FONT
# =========================
[font]
size = 12.0

[font.normal]
family = "DaddyTimeMono Nerd Font"
style = "Regular"

[font.bold]
family = "DaddyTimeMono Nerd Font"
style = "Bold"

[font.italic]
family = "DaddyTimeMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "DaddyTimeMono Nerd Font"
style = "Bold Italic"

# =========================
# 🌌 COLORS — OMARCHY EVENT HORIZON
# =========================
[colors.primary]
background = '#1a0d2e'
foreground = '#d4a5ff'

[colors.normal]
black = "#2d1b4e"
red = "#ff6ec7"
green = "#5ffbf1"
yellow = "#f9f871"
blue = "#8b9aff"
magenta = "#f4a5ff"
cyan = "#5ffbf1"
white = "#ffffff"

[colors.bright]
black = "#543a6e"
red = "#ff9adc"
green = "#8ffef4"
yellow = "#fbf9a5"
blue = "#b8c1ff"
magenta = "#ffc8ff"
cyan = "#8ffef4"
white = "#fef6ff"

[colors.cursor]
text = "#1a0d2e"
cursor = "#ff6ec7"
# =========================
# 🖱 CURSOR
# =========================
[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true

# =========================
# ⚙️ GENERAL
# =========================
[general]
live_config_reload = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = false

[[mouse.bindings]]
mouse = "Right"
action = "PasteSelection"


